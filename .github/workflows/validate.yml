name: validate

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests, skills, and README discipline
        run: python3 scripts/validate_plugin.py
      - name: Unit tests for skill scripts
        run: python3 -m unittest discover -s plugins/unity-handbook/skills/handbook-refresh/scripts -p 'test_*.py'
